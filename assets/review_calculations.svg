<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>02 / Calculation and evidence</title><desc>SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</desc><rect width="1200" height="840" fill="#f6f8fc"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#133b65" font-weight="700">02 / Calculation and evidence</text><text x="48" y="111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#526278" font-weight="400">SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</text><rect x="42" y="145" width="1116" height="142" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="145" width="7" height="142" fill="#2365a0"/><text x="65" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#2365a0" font-weight="700">DEFINED CALCULATION</text><text x="65" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">Observed level = sum(confidence×level)/sum(confidence); priority = positive</text><text x="65" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">gap×importance.</text><text x="60" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#128075" font-weight="700">Worked example — illustrative, not a measured research result</text><rect x="48" y="345" width="1104" height="51" fill="#eaf0f7"/><text x="63" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">weighted level: levels 2,4; weights 1,3</text><text x="797" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">3.5000</text><text x="950" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><rect x="48" y="401" width="1104" height="51" fill="#ffffff"/><text x="63" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">gap: target 4 minus level 3.5</text><text x="797" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">0.5000</text><text x="950" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><rect x="48" y="457" width="1104" height="51" fill="#eaf0f7"/><text x="63" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">priority: gap .5 times importance 2</text><text x="797" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">1.0000</text><text x="950" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><text x="48" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#23354b" font-weight="400">Source: results/review_examples.json | SHA-256 prefix: d2327691627fbd95</text><text x="48" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#23354b" font-weight="400">Illustrative inputs and calculations are in scripts/review_examples.py.</text></svg>
