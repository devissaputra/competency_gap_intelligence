<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>01 / Which evidenced skill gaps should be addressed first?</title><desc>SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</desc><rect width="1200" height="840" fill="#f6f8fc"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#133b65" font-weight="700">01 / Which evidenced skill gaps should be addressed first?</text><text x="48" y="111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#526278" font-weight="400">SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</text><rect x="42" y="145" width="1116" height="134" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="145" width="7" height="134" fill="#2365a0"/><text x="65" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#2365a0" font-weight="700">DATA / OBSERVATION UNIT</text><text x="65" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">Supplied role targets, dated competency evidence, prerequisites and resource metadata.</text><rect x="42" y="295" width="1116" height="166" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="295" width="7" height="166" fill="#128075"/><text x="65" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#128075" font-weight="700">DESIGN / COMPARISON</text><text x="65" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">Confidence-weight evidence; retain unknown/stale status; prioritize confirmed gaps and</text><text x="65" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">check prerequisites.</text><rect x="42" y="477" width="1116" height="270" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="477" width="7" height="270" fill="#8b4d27"/><text x="65" y="509" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#8b4d27" font-weight="700">FINDING / INTERPRETATION</text><text x="65" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">This competency-planning prototype compares role requirements with dated, confidence-</text><text x="65" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">labeled evidence and keeps missing or stale evidence visible. Only sufficiently supported</text><text x="65" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">gaps are ranked, after which prerequisite constraints shape development sequences and</text><text x="65" y="638" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">resource matches. The calculations are auditable decision support; they do not turn</text><text x="65" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">subjective competency ratings into validated measures.</text><text x="48" y="796" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#23354b" font-weight="400">Read the calculation guide for source paths, assumptions and reproduction status.</text></svg>
