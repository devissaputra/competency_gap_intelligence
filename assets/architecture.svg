<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Competency Gap Intelligence workflow</title>
<desc id="desc">Role requirements and competency evidence pass through evidence-aware gap classification, prerequisite sequencing, resource matching, and ranking sensitivity review.</desc>
